name: CI

on:
  push:
    branches: [main, 'substrate/**']
  pull_request:
    branches: [main]
  # The evidence suite depends on external repositories that can change without
  # anything in this one changing, so it also runs on a schedule.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: types · lint · unit · build · budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and data-integrity tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Performance budget
        run: npm run budget

      - name: No known vulnerabilities
        run: npm audit --audit-level=high

  a11y:
    name: accessibility
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: axe + structural a11y (desktop and mobile)
        run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  evidence:
    name: evidence still resolves
    runs-on: ubuntu-latest
    # Never blocks a merge: these assertions depend on other repositories being
    # reachable, so a GitHub outage must not fail an unrelated pull request.
    # It is a monitor, not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every cited source resolves and every excerpt is verbatim
        run: npm run test:evidence
